<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="seedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5a3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c3d2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="seedlingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7cb342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558b2f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#f5deb3" opacity="0.8" stroke="#c1440e" stroke-width="2"/>

  <!-- Soil (ground) -->
  <ellipse cx="60" cy="95" rx="48" ry="12" fill="url(#seedGrad)"/>

  <!-- Three stages of growth -->

  <!-- Stage 1: Seed (left) -->
  <g transform="translate(25, 80)">
    <!-- Seed -->
    <ellipse cx="0" cy="0" rx="5" ry="7" fill="#3d2817" stroke="#1a1a1a" stroke-width="0.5"/>
    <!-- Seed line -->
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#5c3d2e" stroke-width="1"/>
  </g>

  <!-- Stage 2: Seedling (middle) -->
  <g transform="translate(60, 75)">
    <!-- Root -->
    <line x1="0" y1="5" x2="0" y2="15" stroke="#8b5a3c" stroke-width="2" stroke-linecap="round"/>

    <!-- Stem -->
    <path d="M 0 5 Q 0 -5 0 -15" stroke="url(#seedlingGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- First leaves -->
    <ellipse cx="-6" cy="-5" rx="4" ry="3" fill="#7cb342" transform="rotate(-35 -6 -5)"/>
    <ellipse cx="6" cy="-5" rx="4" ry="3" fill="#7cb342" transform="rotate(35 6 -5)"/>

    <!-- Second leaves -->
    <ellipse cx="-5" cy="-12" rx="3.5" ry="2.5" fill="#8bc34a" transform="rotate(-30 -5 -12)"/>
    <ellipse cx="5" cy="-12" rx="3.5" ry="2.5" fill="#8bc34a" transform="rotate(30 5 -12)"/>

    <!-- Top leaf -->
    <ellipse cx="0" cy="-18" rx="2" ry="3" fill="#9ccc65"/>
  </g>

  <!-- Stage 3: Plant/Tree (right) -->
  <g transform="translate(95, 65)">
    <!-- Root -->
    <path d="M 0 10 L -2 20 M 0 10 L 0 22 M 0 10 L 2 20" stroke="#8b5a3c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Main stem -->
    <line x1="0" y1="10" x2="0" y2="-20" stroke="#5c3d2e" stroke-width="3"/>

    <!-- Branches -->
    <line x1="0" y1="-5" x2="-8" y2="-12" stroke="#7cb342" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="8" y2="-12" stroke="#7cb342" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="-6" y2="-20" stroke="#8bc34a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="6" y2="-20" stroke="#8bc34a" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Leaves (crown) -->
    <circle cx="-5" cy="-15" r="4" fill="#7cb342" opacity="0.8"/>
    <circle cx="5" cy="-15" r="4" fill="#7cb342" opacity="0.8"/>
    <circle cx="0" cy="-22" r="4" fill="#8bc34a" opacity="0.8"/>
    <circle cx="-3" cy="-25" r="3" fill="#9ccc65" opacity="0.7"/>
    <circle cx="3" cy="-25" r="3" fill="#9ccc65" opacity="0.7"/>

    <!-- Light glow at top -->
    <circle cx="0" cy="-30" r="8" fill="#ffc857" opacity="0.2"/>
  </g>

  <!-- Arrow showing progression -->
  <path d="M 38 55 L 50 55" stroke="#dc8033" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" marker-end="url(#arrowhead)"/>
  <path d="M 73 50 L 85 50" stroke="#dc8033" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc8033" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Learning symbol (light bulb at top) -->
  <g transform="translate(60, 15)">
    <circle cx="0" cy="0" r="4" fill="#ffff00" opacity="0.7"/>
    <ellipse cx="0" cy="3" rx="1.5" ry="1" fill="#ffd700"/>
    <path d="M -1 0.5 Q 0 1.5 1 0.5" stroke="#ffc857" stroke-width="0.6" fill="none"/>
    <!-- Rays -->
    <line x1="0" y1="-5.5" x2="0" y2="-8" stroke="#ffc857" stroke-width="1" opacity="0.6"/>
    <line x1="4" y1="-1" x2="6.5" y2="-3.5" stroke="#ffc857" stroke-width="1" opacity="0.6"/>
    <line x1="-4" y1="-1" x2="-6.5" y2="-3.5" stroke="#ffc857" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Decorative border -->
  <path d="M 20 60 Q 12 45 25 35" fill="none" stroke="#dc8033" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
</svg>