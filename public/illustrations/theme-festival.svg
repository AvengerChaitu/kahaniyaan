<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="flameGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffc857;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b00;stop-opacity:0.4" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#f5deb3" opacity="0.8" stroke="#c1440e" stroke-width="2"/>

  <!-- Main diya (lamp) - ceramic pot -->
  <ellipse cx="60" cy="70" rx="22" ry="18" fill="#d4a574" stroke="#8b5a3c" stroke-width="1.5"/>
  <!-- Diya top (lip) -->
  <ellipse cx="60" cy="55" rx="22" ry="6" fill="#c9956e" stroke="#8b5a3c" stroke-width="1"/>
  <!-- Diya opening -->
  <ellipse cx="60" cy="54" rx="14" ry="4" fill="#8b5a3c" opacity="0.3"/>

  <!-- Diya pattern (decorative) -->
  <line x1="45" y1="65" x2="75" y2="65" stroke="#8b5a3c" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="75" r="2" fill="#dc8033" opacity="0.5"/>
  <circle cx="60" cy="78" r="2" fill="#dc8033" opacity="0.5"/>
  <circle cx="70" cy="75" r="2" fill="#dc8033" opacity="0.5"/>

  <!-- Flame (main fire) -->
  <path d="M 60 45 Q 55 35 58 25 Q 60 20 60 18 Q 62 20 62 25 Q 65 35 60 45 Z" fill="url(#flameGrad)"/>
  <path d="M 60 42 Q 57 35 58 28 Q 60 23 60 22 Q 62 23 62 28 Q 63 35 60 42 Z" fill="#ffff00" opacity="0.6"/>

  <!-- Flame glow -->
  <circle cx="60" cy="32" r="15" fill="#ff6b00" opacity="0.15"/>
  <circle cx="60" cy="32" r="10" fill="#ffc857" opacity="0.2"/>

  <!-- Oil level inside diya -->
  <ellipse cx="60" cy="72" rx="18" ry="12" fill="#3d2817" opacity="0.2"/>

  <!-- Second smaller diya (background) -->
  <g transform="translate(35, 85)">
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#d4a574" opacity="0.7"/>
    <ellipse cx="0" cy="-8" rx="12" ry="4" fill="#c9956e" opacity="0.7"/>
    <path d="M 0 -15 Q -2 -25 0 -30 Q 1 -26 2 -25 Q 2 -15 0 -15 Z" fill="#ffff99" opacity="0.5"/>
    <circle cx="0" cy="-22" r="8" fill="#ff6b00" opacity="0.1"/>
  </g>

  <!-- Third smaller diya (background) -->
  <g transform="translate(85, 85)">
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#d4a574" opacity="0.7"/>
    <ellipse cx="0" cy="-8" rx="12" ry="4" fill="#c9956e" opacity="0.7"/>
    <path d="M 0 -15 Q -2 -25 0 -30 Q 1 -26 2 -25 Q 2 -15 0 -15 Z" fill="#ffff99" opacity="0.5"/>
    <circle cx="0" cy="-22" r="8" fill="#ff6b00" opacity="0.1"/>
  </g>

  <!-- Celebration stars around -->
  <g transform="translate(25, 35)">
    <polygon points="0,-4 1,-1 4,-1 2,1 3,4 0,2 -3,4 -2,1 -4,-1 -1,-1" fill="#ffc857" opacity="0.7"/>
  </g>

  <g transform="translate(95, 40)">
    <polygon points="0,-3 0.8,-0.5 3,-0.5 1.5,1 2,3 0,1.5 -2,3 -1.5,1 -3,-0.5 -0.8,-0.5" fill="#ffc857" opacity="0.7"/>
  </g>

  <g transform="translate(30, 75)">
    <polygon points="0,-2.5 0.6,-0.3 2.5,-0.3 1,0.8 1.5,2.5 0,1.2 -1.5,2.5 -1,0.8 -2.5,-0.3 -0.6,-0.3" fill="#dc8033" opacity="0.6"/>
  </g>

  <!-- Decorative border -->
  <path d="M 15 60 Q 10 50 20 40" fill="none" stroke="#dc8033" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
</svg>