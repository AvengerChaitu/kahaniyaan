<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="elephantGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#707070;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#f5deb3" opacity="0.8" stroke="#c1440e" stroke-width="2"/>

  <!-- Elephant body -->
  <ellipse cx="50" cy="65" rx="22" ry="28" fill="url(#elephantGray)"/>

  <!-- Elephant head -->
  <circle cx="50" cy="35" r="18" fill="url(#elephantGray)"/>

  <!-- Elephant ears -->
  <ellipse cx="35" cy="40" rx="14" ry="22" fill="#808080"/>
  <ellipse cx="35" cy="40" rx="8" ry="16" fill="#606060"/>
  <ellipse cx="65" cy="40" rx="14" ry="22" fill="#808080"/>
  <ellipse cx="65" cy="40" rx="8" ry="16" fill="#606060"/>

  <!-- Trunk (curved) -->
  <path d="M 50 48 Q 45 60 48 75" stroke="#707070" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 50 48 Q 45 60 48 75" stroke="#8b8b8b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="45" cy="32" r="2" fill="#1a1a1a"/>
  <circle cx="55" cy="32" r="2" fill="#1a1a1a"/>
  <circle cx="45.5" cy="31.5" r="0.8" fill="white"/>
  <circle cx="55.5" cy="31.5" r="0.8" fill="white"/>

  <!-- Tusks (small) -->
  <path d="M 42 48 Q 40 55 42 60" stroke="#f5deb3" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 58 48 Q 60 55 58 60" stroke="#f5deb3" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Front legs -->
  <rect x="42" y="88" width="5" height="12" fill="#707070" rx="2"/>
  <rect x="58" y="88" width="5" height="12" fill="#707070" rx="2"/>

  <!-- Wisdom symbol (small star on head) -->
  <g transform="translate(50, 20)">
    <polygon points="0,-4 1,-1 4,-1 2,1 3,4 0,2 -3,4 -2,1 -4,-1 -1,-1" fill="#ffc857"/>
  </g>

  <!-- Decorative border -->
  <path d="M 5 60 Q 0 45 15 30" fill="none" stroke="#dc8033" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
  <path d="M 115 60 Q 120 45 105 30" fill="none" stroke="#dc8033" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
</svg>