<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#f5deb3" opacity="0.8" stroke="#c1440e" stroke-width="2"/>

  <!-- Paper/Note -->
  <rect x="20" y="25" width="40" height="50" fill="#fffef0" stroke="#d4a574" stroke-width="2" rx="2"/>

  <!-- Pencil -->
  <g transform="translate(35, 55) rotate(-45)">
    <!-- Wooden part -->
    <rect x="0" y="0" width="35" height="5" fill="#8b5a3c" rx="2.5"/>
    <!-- Eraser -->
    <rect x="35" y="0" width="6" height="5" fill="#ff6b6b" rx="2"/>
    <!-- Metal part -->
    <rect x="31" y="0" width="4" height="5" fill="#c0c0c0"/>
    <!-- Lead tip -->
    <polygon points="36,2.5 42,0 42,5" fill="#3d2817"/>
  </g>

  <!-- Text lines on paper (writing) -->
  <line x1="25" y1="35" x2="55" y2="35" stroke="#c9956e" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="43" x2="55" y2="43" stroke="#c9956e" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="51" x2="50" y2="51" stroke="#c9956e" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="59" x2="45" y2="59" stroke="#c9956e" stroke-width="1.5" opacity="0.6"/>

  <!-- Decorative mark -->
  <circle cx="75" cy="30" r="8" fill="none" stroke="#dc8033" stroke-width="1.5" opacity="0.6"/>
  <path d="M 72 30 L 75 33 L 78 28" stroke="#dc8033" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Number badge -->
  <circle cx="50" cy="8" r="7" fill="#dc8033"/>
  <text x="50" y="12" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">01</text>
</svg>